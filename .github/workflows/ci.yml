name: ci

# Build and run the acceptance suite on every PR and on pushes to main. The Reqnroll scenarios
# drive the real built protostar binary, so this also exercises the CLI end to end. Run on both
# Linux and Windows to cover the OS-specific binary name and install paths.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0          # MinVer needs full history to compute the version.

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      # Issue #90: the Windows one-liner broke under Windows PowerShell 5.1. Run this branch's
      # installer the way the documented one-liner does (a script block built from the script's text),
      # under powershell.exe 5.1 rather than pwsh, for both channels. It downloads the real release
      # asset and installs into a temp dir without touching PATH or hooks, then runs the installed binary.
      - name: Installer one-liner (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)), PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1.' }
          $installer = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1))
          foreach ($channel in 'stable', 'edge') {
            $dir = Join-Path $env:RUNNER_TEMP "protostar-$channel"
            & $installer -Channel $channel --dir $dir --no-modify-path --no-hooks
            & (Join-Path $dir 'protostar.exe') --version
            if ($LASTEXITCODE -ne 0) { throw "protostar --version failed for $channel." }
          }
